<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-labelledby="t d">
<title id="t">Vichaksha Geekiyanage · AI/ML Engineer</title>
<desc id="d">Vichaksha Geekiyanage, AI/ML engineer in Sri Lanka. Builds voice agents that speak Sinhala, Tamil and English, WhatsApp AI agents serving 10K+ customers a day, garment measuring vision systems and self retraining ML pipelines.</desc>

<svg xmlns="http://www.w3.org/2000/svg" width="480" height="256" viewBox="0 0 480 256" role="img" aria-label="Smart Desk Assistant: An ESP32-S3 node streams air quality, noise and light over MQTT/TLS to a backend, a mobile app and AI insights. 4 layers: firmware, cloud, API, mobile.">
<defs>
  <clipPath id="c"><rect x="0.5" y="0.5" width="479" height="255" rx="14"/></clipPath>
  <linearGradient id="bar" x1="0" x2="1"><stop offset="0" stop-color="#FFBE29"/><stop offset="1" stop-color="#2DD4BF" stop-opacity="0.15"/></linearGradient>
  <radialGradient id="glow" cx="100%" cy="0%" r="70%"><stop offset="0" stop-color="#FFBE29" stop-opacity="0.13"/><stop offset="1" stop-color="#FFBE29" stop-opacity="0"/></radialGradient>
</defs>
<style>
  .eye{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;font-size:11.5px;font-weight:600;letter-spacing:1.6px;fill:#FFBE29}
  .title{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif;font-size:25px;font-weight:700;fill:#e6edf3}
  .desc{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif;font-size:14.5px;fill:#9198a1}
  .metric{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif;font-size:32px;font-weight:800;fill:#FFBE29}
  .label{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif;font-size:13px;fill:#9198a1}
  .chip{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif;font-size:12px;font-weight:600;fill:#e6edf3}
  .arrow{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif;font-size:20px;fill:#9198a1;animation:nudge 2.4s ease-in-out infinite}
  @keyframes nudge{0%,70%,100%{transform:translate(0,0)}85%{transform:translate(2px,-2px)}}
  .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 1.8s ease-out infinite}
  @keyframes pulse{0%{transform:scale(1);opacity:.7}100%{transform:scale(3.2);opacity:0}}
  .sweep{animation:sweep 3.5s ease-in-out infinite}
  @keyframes sweep{0%{transform:translateX(-140px)}60%,100%{transform:translateX(500px)}}
  @media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<g clip-path="url(#c)">
  <rect width="480" height="256" fill="#161b22"/>
  <rect width="480" height="256" fill="url(#glow)"/>
  <rect width="480" height="4" fill="url(#bar)"/>
  <rect class="sweep" width="120" height="4" fill="#FFBE29" opacity="0.55"/>
</g>
<rect x="0.5" y="0.5" width="479" height="255" rx="14" fill="none" stroke="#30363d"/>
<text class="eye" x="28" y="44">IOT · DEVICE TO APP</text>
<text class="arrow" x="454" y="47" text-anchor="end">↗</text>
<text class="title" x="28" y="80">Smart Desk Assistant</text>
<text class="desc" x="28" y="110">An ESP32-S3 node streams air quality, noise and light over</text><text class="desc" x="28" y="131">MQTT/TLS to a backend, a mobile app and AI insights.</text>
<text class="metric" x="28" y="178">4</text>
<text class="label" x="60.5" y="172">layers: firmware, cloud, API, mobile</text>
<rect x="28.0" y="206" width="80.2" height="24" rx="12" fill="#1f2630" stroke="#30363d"/><text class="chip" x="68.1" y="222" text-anchor="middle">ESP32-S3</text><rect x="115.2" y="206" width="77.8" height="24" rx="12" fill="#1f2630" stroke="#30363d"/><text class="chip" x="154.2" y="222" text-anchor="middle">FreeRTOS</text><rect x="200.1" y="206" width="53.4" height="24" rx="12" fill="#1f2630" stroke="#30363d"/><text class="chip" x="226.8" y="222" text-anchor="middle">MQTT</text><rect x="260.4" y="206" width="89.6" height="24" rx="12" fill="#1f2630" stroke="#30363d"/><text class="chip" x="305.2" y="222" text-anchor="middle">PostgreSQL</text><rect x="357.0" y="206" width="47.1" height="24" rx="12" fill="#1f2630" stroke="#30363d"/><text class="chip" x="380.6" y="222" text-anchor="middle">Expo</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="480" height="256" viewBox="0 0 480 256" role="img" aria-label="Garment Measurement: Measures garments from a live camera feed using pose keypoints and ChArUco calibration, retrained continuously. 18 keypoint skeleton for long sleeve garments.">
<defs>
  <clipPath id="c"><rect x="0.5" y="0.5" width="479" height="255" rx="14"/></clipPath>
  <linearGradient id="bar" x1="0" x2="1"><stop offset="0" stop-color="#0F766E"/><stop offset="1" stop-color="#B45309" stop-opacity="0.15"/></linearGradient>
  <radialGradient id="glow" cx="100%" cy="0%" r="70%"><stop offset="0" stop-color="#0F766E" stop-opacity="0.08"/><stop offset="1" stop-color="#0F766E" stop-opacity="0"/></radialGradient>
</defs>
<style>
  .eye{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;font-size:11.5px;font-weight:600;letter-spacing:1.6px;fill:#0F766E}
  .title{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif;font-size:25px;font-weight:700;fill:#1f2328}
  .desc{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif;font-size:14.5px;fill:#59636e}
  .metric{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif;font-size:32px;font-weight:800;fill:#0F766E}
  .label{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif;font-size:13px;fill:#59636e}
  .chip{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif;font-size:12px;font-weight:600;fill:#1f2328}
  .arrow{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif;font-size:20px;fill:#59636e;animation:nudge 2.4s ease-in-out infinite}
  @keyframes nudge{0%,70%,100%{transform:translate(0,0)}85%{transform:translate(2px,-2px)}}
  .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 1.8s ease-out infinite}
  @keyframes pulse{0%{transform:scale(1);opacity:.7}100%{transform:scale(3.2);opacity:0}}
  .sweep{animation:sweep 3.5s ease-in-out infinite}
  @keyframes sweep{0%{transform:translateX(-140px)}60%,100%{transform:translateX(500px)}}
  @media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<g clip-path="url(#c)">
  <rect width="480" height="256" fill="#f6f8fa"/>
  <rect width="480" height="256" fill="url(#glow)"/>
  <rect width="480" height="4" fill="url(#bar)"/>
  <rect class="sweep" width="120" height="4" fill="#0F766E" opacity="0.55"/>
</g>
<rect x="0.5" y="0.5" width="479" height="255" rx="14" fill="none" stroke="#d1d9e0"/>
<text class="eye" x="28" y="44">COMPUTER VISION · INDUSTRY + ACADEMIA</text>
<text class="arrow" x="454" y="47" text-anchor="end">↗</text>
<text class="title" x="28" y="80">Garment Measurement</text>
<text class="desc" x="28" y="110">Measures garments from a live camera feed using pose</text><text class="desc" x="28" y="131">keypoints and ChArUco calibration, retrained continuously.</text>
<text class="metric" x="28" y="178">18</text>
<text class="label" x="81.0" y="172">keypoint skeleton for long sleeve garments</text>
<rect x="28.0" y="206" width="94.2" height="24" rx="12" fill="#eef1f4" stroke="#d1d9e0"/><text class="chip" x="75.1" y="222" text-anchor="middle">YOLOv8 pose</text><rect x="129.2" y="206" width="62.5" height="24" rx="12" fill="#eef1f4" stroke="#d1d9e0"/><text class="chip" x="160.4" y="222" text-anchor="middle">OpenCV</text><rect x="198.6" y="206" width="48.3" height="24" rx="12" fill="#eef1f4" stroke="#d1d9e0"/><text class="chip" x="222.8" y="222" text-anchor="middle">PyQt</text><rect x="254.0" y="206" width="64.9" height="24" rx="12" fill="#eef1f4" stroke="#d1d9e0"/><text class="chip" x="286.4" y="222" text-anchor="middle">MLflow</text><rect x="325.8" y="206" width="54.8" height="24" rx="12" fill="#eef1f4" stroke="#d1d9e0"/><text class="chip" x="353.2" y="222" text-anchor="middle">GoPro</text>
</svg>
